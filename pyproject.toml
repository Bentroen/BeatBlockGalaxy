[tool.poetry]
name = "beatblockgalaxy"
version = "0.1.0"
description = "A recreation of Beat Block Galaxy from Super Mario Galaxy 2 in Minecraft, featuring a note block cover song."
authors = ["Bentroen <bemcdc@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
beet = "^0.71.0"
bolt = "^0.17.5"
pigstep = "^0.2.1"

[tool.poetry.dev-dependencies]
black = "^22.6.0"
isort = "^5.10.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
